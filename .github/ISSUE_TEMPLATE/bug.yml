name: Ошибка
description: Что-то работает не так
title: "[Ошибка] "
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes: {label: Что ты делал(а), description: Шаги, чтобы повторить}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Что ожидалось и что произошло}
    validations: {required: true}
  - type: input
    id: device
    attributes: {label: Устройство и браузер, placeholder: "ПК, Chrome 130 / Android, Chrome"}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Версия игры, placeholder: "v0.3"}
  - type: textarea
    id: extra
    attributes: {label: Скриншоты или дополнительно}
