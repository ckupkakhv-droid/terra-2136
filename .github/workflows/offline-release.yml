name: Publish verified offline release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Exact 40-character source commit to build'
        required: true
        default: '44a56846346025f6756d3081d79f33a6637cdf69'
        type: string
      release_tag:
        description: 'Existing draft release name (an existing tag must match source_ref)'
        required: true
        default: 'v0.4.2'
        type: string
      expected_sha256:
        description: 'Expected SHA256 of the reviewed terra.html artifact'
        required: true
        default: '99b4f4a463b4ef297cb6a5ace1ccf25e6276e66954a1114f7f3e4b2d50803c0f'
        type: string

permissions:
  contents: write

concurrency:
  group: offline-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_ref must be an immutable commit SHA'; exit 1; }
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'Invalid expected SHA256'; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo 'Invalid release tag'; exit 1; }

      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Verify source and draft release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_REF" ]]
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -Fx true
          # A draft may not have created its Git tag yet. Existing tags are immutable here.
          refs=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG")
          tag_json=$(jq --arg ref "refs/tags/$RELEASE_TAG" 'map(select(.ref == $ref)) | .[0] // null' <<< "$refs")
          if [[ "$tag_json" != null ]]; then
            tag_type=$(jq -r '.object.type' <<< "$tag_json")
            tag_sha=$(jq -r '.object.sha' <<< "$tag_json")
            for attempt in 1 2 3 4 5; do
              [[ "$tag_type" == tag ]] || break
              tag_json=$(gh api "repos/$GH_REPO/git/tags/$tag_sha")
              tag_type=$(jq -r '.object.type' <<< "$tag_json")
              tag_sha=$(jq -r '.object.sha' <<< "$tag_json")
            done
            [[ "$tag_type" == commit && "$tag_sha" == "$SOURCE_REF" ]] || { echo 'Existing tag does not point at reviewed source'; exit 1; }
          fi

      - name: Build and verify artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-offline.py
          printf '%s  terra.html\n' "$EXPECTED_SHA256" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          test "$(stat -c %s terra.html)" -le 50000000

      - name: Upload to existing draft
        shell: bash
        run: |
          set -euo pipefail
          # Never replace files on an already published release.
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -Fx true
          gh release edit "$RELEASE_TAG" --target "$SOURCE_REF"
          gh release upload "$RELEASE_TAG" terra.html SHA256SUMS.txt --clobber

      - name: Publish verified release
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -Fx true
          gh release edit "$RELEASE_TAG" --target "$SOURCE_REF" --draft=false --latest
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
          printf '\nArtifact SHA256: `%s`\n' "$EXPECTED_SHA256" >> "$GITHUB_STEP_SUMMARY"
